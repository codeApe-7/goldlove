services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: marriage_archive
      POSTGRES_USER: archive_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive_owner -d marriage_archive"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: flyway/flyway:13
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/marriage_archive
      FLYWAY_USER: archive_owner
      FLYWAY_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 30
    volumes:
      - ./services/platform-api/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/platform-api/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/marriage_archive
      DB_USERNAME: archive_app
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      FLYWAY_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:?set PHONE_ENCRYPTION_KEY in .env}
      PHONE_SEARCH_KEY: ${PHONE_SEARCH_KEY:?set PHONE_SEARCH_KEY in .env}
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:?set PROFILE_ENCRYPTION_KEY in .env}
      PROFILE_HMAC_KEY: ${PROFILE_HMAC_KEY:?set PROFILE_HMAC_KEY in .env}
      COS_SECRET_ID: ${COS_SECRET_ID:?set COS_SECRET_ID in .env}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?set COS_SECRET_KEY in .env}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET: ${COS_BUCKET:?set COS_BUCKET in .env}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      BROWSER_ALLOWED_ORIGINS: ${BROWSER_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
