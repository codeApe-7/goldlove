spring:
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: true
    clean-disabled: true

logging:
  level:
    root: WARN

app:
  identity:
    authentication-rate-limit:
      account-max-attempts: 3
      account-window: 15m
      client-max-attempts: 4
      client-window: 1m
    browser-security:
      allowed-origins:
        - https://h5.example.test
    security:
      argon2:
        memory-ki-b: 1024
        iterations: 1
