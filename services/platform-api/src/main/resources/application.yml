spring:
  application:
    name: marriage-profile-platform-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marriage_archive}
    username: ${DB_USERNAME:archive_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/marriage_archive}}
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:archive_app}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:}}
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      update-strategy: not_null

sa-token:
  token-name: archive-token
  timeout: 2592000
  active-timeout: 604800
  is-concurrent: true
  is-share: false
  token-style: tik
  is-log: false
  cookie:
    path: /
    secure: ${AUTH_COOKIE_SECURE:true}
    http-only: true
    same-site: Lax

app:
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  identity:
    authentication-rate-limit:
      account-max-attempts: ${AUTH_ACCOUNT_MAX_ATTEMPTS:5}
      account-window: ${AUTH_ACCOUNT_WINDOW:15m}
      client-max-attempts: ${AUTH_CLIENT_MAX_ATTEMPTS:30}
      client-window: ${AUTH_CLIENT_WINDOW:1m}
    browser-security:
      allowed-origins: ${BROWSER_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
    security:
      argon2:
        memory-ki-b: 65536
        iterations: 3
        parallelism: 1
        salt-length: 16
        hash-length: 32
  membership:
    svip-threshold-minor: ${MEMBERSHIP_SVIP_THRESHOLD_MINOR:59900}
  payment:
    online:
      provider: ${ONLINE_PAYMENT_PROVIDER:}
      vip-upgrade-amount-minor: ${VIP_UPGRADE_AMOUNT_MINOR:100}
      order-description: ${VIP_UPGRADE_DESCRIPTION:婚恋智能档案库 VIP 会员}
  storage:
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      region: ${COS_REGION:ap-guangzhou}
      bucket: ${COS_BUCKET:}
  xpay:
    pid: ${XPAY_PID:}
    merchant-private-key: ${XPAY_MERCHANT_PRIVATE_KEY:}
    platform-public-key: ${XPAY_PLATFORM_PUBLIC_KEY:}
    notify-url: ${XPAY_NOTIFY_URL:}
    return-url: ${XPAY_RETURN_URL:}
    base-url: ${XPAY_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
